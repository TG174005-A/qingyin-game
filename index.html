<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CMS Platform V6 FINAL COMPLETE</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",Arial;background:#f1f5f9;margin:0}
.card{background:#fff;margin:15px;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0002}
button{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:8px}
input,textarea,select{width:100%;padding:10px;margin:5px 0}
.hidden{display:none}
.item{display:inline-block;width:240px;margin:10px}
@media(max-width:600px){.item{width:100%}}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h1>CMS Platform V6</h1>
<input id="username" placeholder="账号">
<input id="password" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<button onclick="register()">注册</button>
<p id="msg"></p>
</div>

<div id="app" class="hidden">
<div class="card">
<h2 id="siteTitle">CMS</h2>
<span id="userInfo"></span>
<button onclick="logout()">退出</button>
<button id="adminBtn" class="hidden" onclick="openAdmin()">管理后台</button>
</div>

<div id="notice" class="card"></div>
<button onclick="openPublish()">发布内容</button>
<button onclick="shareQR()">分享</button>
<div id="sections"></div>
</div>

<script>
const SUPABASE_URL="https://pnqlhpwfkqonhyrtgrha.supabase.co";
const SUPABASE_KEY="sb_publishable_u1KUB7-FCV7OBzToH8CBbA_qsYY9ZcQ";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let profile=null;

async function register(){
 let n=username.value.trim(),p=password.value.trim();
 let {data}=await db.from("profiles").select("*").eq("username",n).maybeSingle();
 if(data){msg.innerHTML="账号已存在";return}
 let {error}=await db.from("profiles").insert({username:n,password:p,role:"user"});
 msg.innerHTML=error?error.message:"注册成功";
}

async function login(){
 let {data,error}=await db.from("profiles").select("*")
 .eq("username",username.value.trim())
 .eq("password",password.value.trim()).maybeSingle();

 if(error||!data){msg.innerHTML="账号或密码错误";return}
 profile=data;
 localStorage.profile=JSON.stringify(data);
 showApp();
}

function showApp(){
 loginBox.classList.add("hidden");
 app.classList.remove("hidden");
 userInfo.innerHTML="当前用户："+profile.username;
 if(profile.role==="admin")adminBtn.classList.remove("hidden");
 loadHome();
}

function logout(){localStorage.removeItem("profile");location.reload();}

async function loadHome(){
 let {data:s}=await db.from("settings").select("*").limit(1).maybeSingle();
 if(s){siteTitle.innerHTML=s.site_title||"CMS";notice.innerHTML=s.announcement||""}
 let {data}=await db.from("sections").select("*,contents(*)").order("sort");
 sections.innerHTML="";
 (data||[]).forEach(x=>{
  let box=document.createElement("div");
  box.className="card";
  box.innerHTML="<h2>"+x.title+"</h2>";
  (x.contents||[]).forEach(c=>{
   box.innerHTML+="<div class='card item'><h3>"+c.title+"</h3><p>"+(c.description||"")+"</p></div>";
  });
  sections.appendChild(box);
 });
}

async function uploadFile(file,bucket="media"){
 let name=Date.now()+"_"+file.name;
 let {error}=await db.storage.from(bucket).upload(name,file);
 if(error)return null;
 return db.storage.from(bucket).getPublicUrl(name).data.publicUrl;
}

function openPublish(){alert("发布模块入口")}
function openAdmin(){alert("管理员后台入口")}

async function shareQR(){
 let c=document.createElement("canvas");
 await QRCode.toCanvas(c,location.href);
 document.body.appendChild(c);
}

window.onload=()=>{
 let p=localStorage.profile;
 if(p){profile=JSON.parse(p);showApp();}
}
</script>
</body>
</html>
