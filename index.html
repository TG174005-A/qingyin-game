<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>恋恋空间 Ultimate 完整修复版</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft YaHei"}
body{margin:0;padding:15px;min-height:100vh;background:#fff5f8;background-size:cover;background-position:center}
.box{max-width:1100px;margin:15px auto;background:rgba(255,255,255,.92);padding:20px;border-radius:18px;box-shadow:0 5px 20px #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{padding:15px;border:1px solid #ffc0d0;border-radius:12px;background:#fff}
button{width:100%;padding:12px;margin:5px 0;border:0;border-radius:10px;background:#ff4785;color:white}
input,textarea,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd}
.hide{display:none}
</style>
</head>
<body>

<div class="box" id="loginPage">
<h1>💕 恋恋空间</h1>
<input id="loginAccount" placeholder="账号">
<input id="loginPassword" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<input id="regName" placeholder="注册昵称">
<button onclick="register()">注册</button>
</div>

<div class="box hide" id="homePage">
<h2 id="homeTitle">欢迎来到恋恋空间</h2>
<p id="currentUser"></p>
<button id="adminEntry" class="hide" onclick="openAdmin()">👑最高权限控制台</button>
<div id="showComponents" class="grid"></div>
</div>

<div class="box hide" id="adminPage">
<h2>👑最高权限完整控制</h2>

<h3>主页设置</h3>
<input id="siteTitle" placeholder="标题">
<input type="file" id="bgUpload" accept="image/*">
<input id="alpha" placeholder="透明度 0-1">
<button onclick="saveHome()">保存主页</button>

<h3>组件管理</h3>
<select id="componentType">
<option>🎮游戏</option>
<option>🎬视频</option>
<option>📷照片</option>
<option>💬信息</option>
</select>
<input id="componentName" placeholder="组件名称">
<textarea id="componentValue" placeholder="内容"></textarea>
<input type="file" id="componentFile">
<button onclick="createComponent()">新增组件</button>

<h3>系统管理</h3>
<button onclick="clearComponents()">清空组件</button>
<button onclick="clearUsers()">删除普通用户</button>
<button onclick="closeAdmin()">返回主页</button>
</div>

<script>
const ADMIN={account:"306680070",password:"Aa112211",role:"admin"};
let user=null;

function users(){
 return JSON.parse(localStorage.users||"[]");
}
function saveUsers(v){
 localStorage.users=JSON.stringify(v);
}
function init(){
 let u=users();
 if(!u.find(x=>x.account===ADMIN.account)){
  u.push({account:ADMIN.account,password:ADMIN.password,nickname:"超级管理员",role:"admin"});
  saveUsers(u);
 }
}
init();

function register(){
 let u=users();
 if(!loginAccount.value||!loginPassword.value)return alert("请输入账号密码");
 if(u.find(x=>x.account===loginAccount.value))return alert("账号存在");
 u.push({account:loginAccount.value,password:loginPassword.value,nickname:regName.value||"用户",role:"user"});
 saveUsers(u);
 alert("注册成功");
}

function login(){
 let u=users().find(x=>x.account===loginAccount.value&&x.password===loginPassword.value);
 if(!u)return alert("账号或密码错误");
 user=u;
 loginPage.classList.add("hide");
 homePage.classList.remove("hide");
 currentUser.innerText="当前用户："+u.nickname;
 if(u.role==="admin")adminEntry.classList.remove("hide");
 render();
 loadHome();
}

function openAdmin(){
 if(user&&user.role==="admin")adminPage.classList.remove("hide");
}
function closeAdmin(){adminPage.classList.add("hide")}

function components(){
 return JSON.parse(localStorage.components||"[]");
}
function render(){
 showComponents.innerHTML="";
 components().forEach((c,i)=>{
 showComponents.innerHTML+=`<div class="card">
<h3>${c.type}</h3><b>${c.name}</b>
<p>${c.value}</p>
${user&&user.role==="admin"?`<button onclick="removeComponent(${i})">删除</button>`:""}
</div>`;
 });
}
function createComponent(){
 let arr=components();
 arr.push({type:componentType.value,name:componentName.value,value:componentValue.value});
 localStorage.components=JSON.stringify(arr);
 render();
}

function removeComponent(i){
 let a=components();
 a.splice(i,1);
 localStorage.components=JSON.stringify(a);
 render();
}

function saveHome(){
 let data={title:siteTitle.value,alpha:alpha.value};
 let f=bgUpload.files[0];
 if(f){
  let r=new FileReader();
  r.onload=()=>{data.bg=r.result;localStorage.home=JSON.stringify(data);loadHome()};
  r.readAsDataURL(f);
 }else{
  localStorage.home=JSON.stringify(data);loadHome();
 }
}
function loadHome(){
 let h=JSON.parse(localStorage.home||"{}");
 if(h.title)homeTitle.innerText=h.title;
 if(h.bg)document.body.style.backgroundImage="url("+h.bg+")";
 if(h.alpha)homePage.style.background="rgba(255,255,255,"+h.alpha+")";
}
function clearComponents(){
 localStorage.removeItem("components");render();
}
function clearUsers(){
 saveUsers([ADMIN]);
 alert("普通用户已删除");
}
</script>
</body>
</html>
