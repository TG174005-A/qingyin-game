<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>恋恋空间 修复完整版</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft YaHei"}
body{margin:0;padding:15px;min-height:100vh;background:#fff5f8;background-size:cover;background-position:center}
.box{max-width:900px;margin:15px auto;background:rgba(255,255,255,.9);padding:20px;border-radius:18px}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px}
button{background:#ff4785;color:white;border:0}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{background:white;border:1px solid #ffc0d0;padding:15px;border-radius:12px}
@media(max-width:600px){.box{padding:15px}}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h1>💕 恋恋空间</h1>
<input id="account" placeholder="账号">
<input id="password" type="password" placeholder="密码">
<input id="nickname" placeholder="昵称（注册填写）">
<button onclick="login()">登录</button>
<button onclick="register()">注册</button>
</div>

<div class="box hide" id="homeBox">
<h2 id="title">欢迎来到恋恋空间</h2>
<p id="userInfo"></p>
<button id="adminBtn" class="hide" onclick="openAdmin()">⚙️最高权限</button>
<div id="components" class="grid"></div>
</div>

<div class="box hide" id="adminBox">
<h2>👑最高权限控制中心</h2>

<input type="file" id="bgFile" accept="image/*">
<input id="opacity" placeholder="透明度 0-1">
<input id="newTitle" placeholder="主页标题">

<select id="type">
<option>🎮游戏</option>
<option>🎬视频</option>
<option>📷照片</option>
<option>💬信息</option>
</select>

<input id="compTitle" placeholder="组件标题">
<textarea id="compContent" placeholder="组件内容"></textarea>
<button onclick="addComponent()">添加组件</button>

<input type="file" id="mediaFile" accept="image/*,video/*">
<button onclick="saveMedia()">保存媒体组件</button>

<button onclick="savePage()">保存主页设置</button>
<button onclick="closeAdmin()">返回</button>
</div>

<script>
const ADMIN={account:"306680070",password:"Aa112211"};
let currentAdmin=false;

function initAdmin(){
let users=JSON.parse(localStorage.users||"[]");
if(!users.some(u=>u.account===ADMIN.account)){
users.push({account:ADMIN.account,password:ADMIN.password,nickname:"超级管理员",role:"admin"});
localStorage.users=JSON.stringify(users);
}}
initAdmin();

function login(){
let users=JSON.parse(localStorage.users||"[]");
let u=users.find(x=>x.account===account.value&&x.password===password.value);
if(!u){alert("账号或密码错误");return;}
enter(u);
}

function register(){
let users=JSON.parse(localStorage.users||"[]");
if(users.some(x=>x.account===account.value)){alert("账号已存在");return;}
users.push({account:account.value,password:password.value,nickname:nickname.value,role:"user"});
localStorage.users=JSON.stringify(users);
alert("注册成功");
}

function enter(u){
loginBox.classList.add("hide");
homeBox.classList.remove("hide");
userInfo.innerText="用户："+u.nickname;
currentAdmin=u.role==="admin";
if(currentAdmin)adminBtn.classList.remove("hide");
render();
loadPage();
}

function openAdmin(){if(currentAdmin)adminBox.classList.remove("hide")}
function closeAdmin(){adminBox.classList.add("hide")}

function addComponent(){
let a=JSON.parse(localStorage.components||"[]");
a.push({type:type.value,title:compTitle.value,content:compContent.value});
localStorage.components=JSON.stringify(a);
render();
}

function saveMedia(){
let f=mediaFile.files[0];
if(!f)return;
let r=new FileReader();
r.onload=()=>{
let a=JSON.parse(localStorage.components||"[]");
a.push({type:f.type.startsWith("video")?"🎬视频":"📷照片",title:f.name,content:r.result});
localStorage.components=JSON.stringify(a);
render();
};
r.readAsDataURL(f);
}

function render(){
components.innerHTML="";
JSON.parse(localStorage.components||"[]").forEach((c,i)=>{
components.innerHTML+=`<div class="item"><h3>${c.type}</h3><b>${c.title}</b><p>${c.content.startsWith("data:")?"已上传文件":c.content}</p>${currentAdmin?`<button onclick="del(${i})">删除</button>`:""}</div>`;
});
}
function del(i){
let a=JSON.parse(localStorage.components||"[]");
a.splice(i,1);localStorage.components=JSON.stringify(a);render();
}

function savePage(){
let s={title:newTitle.value,opacity:opacity.value};
localStorage.page=JSON.stringify(s);
loadPage();
}

function loadPage(){
let s=JSON.parse(localStorage.page||"{}");
if(s.title)title.innerText=s.title;
if(s.opacity)homeBox.style.background=`rgba(255,255,255,${s.opacity})`;
}
</script>
</body>
</html>
