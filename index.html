<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网页管理系统 - 自适应版</title>
<style>
:root{
  --primary:#1677ff;
  --primary-hover:#0f68df;
  --text:#1f2329;
  --muted:#6b7280;
  --panel:rgba(255,255,255,.88);
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 12px 32px rgba(0,0,0,.12);
}

*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  color:var(--text);
  background:#ddd center/cover fixed no-repeat;
  overflow-x:hidden;
}

#app{
  width:100%;
  min-height:100vh;
  background:rgba(255,255,255,.85);
  transition:opacity .25s ease;
}

header{
  width:100%;
  min-height:62px;
  padding:12px clamp(14px,3vw,28px);
  background:rgba(30,30,30,.96);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header b{font-size:18px;letter-spacing:.5px}
header div{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#userShow{font-size:14px;color:#f3f4f6}

button{
  appearance:none;
  padding:9px 16px;
  border:0;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-size:14px;
  line-height:1.4;
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
}
button:hover{background:var(--primary-hover);box-shadow:0 4px 12px rgba(22,119,255,.22)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(22,119,255,.25);outline-offset:2px}

input,select{
  width:100%;
  max-width:100%;
  padding:10px 12px;
  margin:5px 0;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font:inherit;
  outline:none;
  transition:border-color .18s ease,box-shadow .18s ease;
}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.12)}
input[type="file"]{padding:8px;background:#f9fafb}

.area{
  width:calc(100% - 30px);
  margin:15px;
  padding:20px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--radius);
  min-height:120px;
  overflow:hidden;
  word-break:break-word;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
  backdrop-filter:blur(3px);
}
.area h2{display:none}
#mediaShow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}

#loginBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:100;
  backdrop-filter:blur(4px);
}

.panel{
  width:100%;
  max-width:390px;
  background:#fff;
  padding:28px;
  border-radius:18px;
  box-shadow:var(--shadow);
}
.panel h2{margin:0 0 14px;font-size:24px}
.panel h3{margin:24px 0 8px;font-size:16px;color:#374151}
.panel button{margin-top:6px;min-width:86px}
#message{min-height:22px;margin:14px 0 0;color:#d4380d;font-size:14px}

#admin{
  display:none;
  position:fixed;
  right:15px;
  top:75px;
  width:calc(100% - 30px);
  max-width:410px;
  max-height:calc(100vh - 90px);
  overflow:auto;
  background:#fff;
  padding:22px;
  border-radius:16px;
  z-index:200;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
#admin h2{margin:0 0 14px;font-size:21px}
#admin h3{margin:24px 0 7px;padding-top:4px;font-size:15px;color:#374151;border-top:1px solid #f0f1f3}
#admin h3:first-of-type{margin-top:20px}
#adminList{margin-top:18px;padding:10px 12px;border-radius:8px;background:#f6f7f9;color:var(--muted);font-size:14px}

img,video{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  max-height:400px;
  margin:0;
  border-radius:12px;
  object-fit:contain;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

@media(max-width:600px){
  header{padding:11px 12px;font-size:16px}
  header div{width:100%;justify-content:space-between}
  .area{width:calc(100% - 20px);margin:10px;padding:14px;min-height:100px}
  button{font-size:13px;padding:8px 12px}
  #admin{left:10px;right:10px;top:68px;width:auto;max-height:calc(100vh - 78px);padding:18px}
  .panel{padding:22px;border-radius:15px}
  .panel h2{font-size:22px}
  #mediaShow{gap:10px}
  img,video{width:100%;max-height:55vh}
}

@media(min-width:1200px){
  .area{max-width:1400px;margin:15px auto}
}
</style>
</head>

<body>

<div id="loginBox">
<div class="panel">
<h2>用户登录</h2>
<input id="loginName" placeholder="账号">
<input id="loginPwd" type="password" placeholder="密码">
<button onclick="login()">登录</button>

<h3>注册普通账户</h3>
<input id="regName" placeholder="账号">
<input id="regPwd" type="password" placeholder="密码">
<button onclick="register()">注册</button>

<p id="message"></p>
</div>
</div>


<div id="app">

<header>
<b>我的网页</b>
<div>
<span id="userShow"></span>
<button id="adminBtn" style="display:none" onclick="showAdmin()">后台</button>
</div>
</header>


<div class="area">
<h2>上区</h2>
</div>

<div class="area">
<h2>中区</h2>
<div id="mediaShow"></div>
</div>

<div class="area">
<h2>下区</h2>
</div>

</div>


<div id="admin">

<h2>最高权限后台</h2>

<button onclick="hideAdmin()">关闭</button>

<h3>网页背景</h3>
<input id="bgInput" type="file" accept="image/*">
<button onclick="setBackground()">修改背景</button>

<h3>透明度</h3>
<input id="opacityInput" type="number" min="1" max="100" value="85">
<button onclick="setOpacity()">调整</button>

<h3>图片/视频管理</h3>
<input id="uploadInput" type="file" accept="image/*,video/*">
<button onclick="upload()">上传</button>

<div id="adminList"></div>

</div>


<script>
const SUPABASE_URL="https://dvvaymfuzprxqxfoqtzo.supabase.co";
const SUPABASE_KEY="sb_publishable_CqNqbc_2Vx-YnTPw_h5A3g_Ai1kmuRk";
let files=[];
let currentUser=null;

async function rpc(name, params={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
    body:JSON.stringify(params)
  });
  const data=await res.json().catch(()=>({ok:false,error:"服务器返回异常"}));
  if(!res.ok) throw new Error(data.message||data.error||"数据库请求失败");
  return data;
}
function token(){return localStorage.getItem("webSessionToken")||"";}
function showUser(user){
  currentUser=user; loginBox.style.display="none"; userShow.textContent="用户："+user.name;
  adminBtn.style.display=user.role==="admin"?"inline-block":"none";
}
async function register(){
  const n=regName.value.trim(),p=regPwd.value;
  try{const d=await rpc("web_register",{p_username:n,p_password:p}); message.textContent=d.ok?"注册成功，请登录":d.error; if(d.ok)regPwd.value="";}
  catch(e){message.textContent=e.message;}
}
async function login(){
  try{const d=await rpc("web_login",{p_username:loginName.value.trim(),p_password:loginPwd.value}); if(!d.ok){message.textContent=d.error;return;} localStorage.setItem("webSessionToken",d.token); showUser(d.user); await loadData();}
  catch(e){message.textContent=e.message;}
}
async function loadData(){
  const d=await rpc("web_load",{p_token:token()});
  if(!d.ok){localStorage.removeItem("webSessionToken");loginBox.style.display="flex";return;}
  files=Array.isArray(d.media)?d.media:[];
  if(d.settings){
    if(d.settings.background)document.body.style.backgroundImage=`url(${d.settings.background})`;
    const op=Number(d.settings.opacity||85); document.getElementById("app").style.opacity=op/100; opacityInput.value=op;
  }
  render();
}
function render(){
  mediaShow.replaceChildren();
  files.forEach(f=>{let el;if(f.type&&f.type.startsWith("image/")){el=document.createElement("img");el.alt="已上传图片";}else if(f.type&&f.type.startsWith("video/")){el=document.createElement("video");el.controls=true;el.preload="metadata";el.playsInline=true;}else{return;}el.src=f.url;mediaShow.appendChild(el);});
}
function showAdmin(){admin.style.display="block";adminList.textContent="当前文件数量："+files.length;}
function hideAdmin(){admin.style.display="none";}
function fileData(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);}
async function upload(){
  const file=uploadInput.files[0]; if(!file)return;
  if(!(file.type.startsWith("image/")||file.type.startsWith("video/"))){alert("只支持图片或视频文件");uploadInput.value="";return;}
  if(file.size>50*1024*1024){alert("文件不能超过50MB");return;}
  try{
    const fd=new FormData();
    fd.append("token",token());
    fd.append("file",file,file.name);
    const res=await fetch(`${SUPABASE_URL}/functions/v1/web-media-upload`,{method:"POST",body:fd});
    const d=await res.json();
    if(!res.ok||!d.ok){alert(d.error||"上传失败");return;}
    uploadInput.value="";
    await loadData();
    if(admin.style.display==="block")adminList.textContent="当前文件数量："+files.length;
  }catch(e){alert(e.message||"上传失败");}
}
function setBackground(){
  const f=bgInput.files[0];if(!f)return;if(!f.type.startsWith("image/")){alert("背景只能选择图片文件");bgInput.value="";return;}
  fileData(f,async url=>{try{const d=await rpc("web_set_background",{p_token:token(),p_background:url});if(!d.ok){alert(d.error);return;}document.body.style.backgroundImage=`url(${url})`;bgInput.value="";}catch(e){alert(e.message);}});
}
async function setOpacity(){
  let value=Number(opacityInput.value);if(!Number.isFinite(value)){alert("请输入 1 到 100 之间的数字");return;}value=Math.max(1,Math.min(100,value));
  try{const d=await rpc("web_set_opacity",{p_token:token(),p_opacity:value});if(!d.ok){alert(d.error);return;}opacityInput.value=d.opacity;document.getElementById("app").style.opacity=d.opacity/100;}catch(e){alert(e.message);}
}
async function logout(){try{if(token())await rpc("web_logout",{p_token:token()});}catch(e){}localStorage.removeItem("webSessionToken");location.reload();}
window.addEventListener("load",async()=>{
  if(!token())return;
  try{const d=await rpc("web_session",{p_token:token()});if(!d.ok){localStorage.removeItem("webSessionToken");return;}showUser(d.user);await loadData();}
  catch(e){message.textContent="数据库连接失败："+e.message;}
});
</script>

</body>
</html>
