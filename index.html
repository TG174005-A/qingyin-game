<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CMS Platform V6</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:"Microsoft YaHei",Arial;background:#f1f5f9;margin:0}
.card{background:#fff;margin:15px;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0002}
button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:8px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
.hidden{display:none}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h1>CMS Platform V6</h1>

<input id="username" placeholder="账号">

<input id="password" type="password" placeholder="密码">

<button onclick="login()">登录</button>
<button onclick="register()">注册</button>

<p id="msg"></p>
</div>


<div id="app" class="hidden">

<div class="card">
<h1 id="siteTitle">CMS</h1>
<span id="userInfo"></span>
<button onclick="logout()">退出</button>
<button id="adminBtn" class="hidden">管理后台</button>
</div>

<div id="notice" class="card"></div>

<div id="sections"></div>

</div>


<script>

const SUPABASE_URL =
"https://pnqlhpwfkqonhyrtgrha.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u1KUB7-FCV7OBzToH8CBbA_qsYY9ZcQ";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let profile=null;


//账号密码登录
async function login(){

let name=username.value;

let pwd=password.value;


let {data,error}=await db
.from("profiles")
.select("*")
.eq("username",name)
.eq("password",pwd)
.single();


if(error || !data){

msg.innerHTML="账号或密码错误";

return;

}


profile=data;


localStorage.user=
JSON.stringify(data);


showApp();

}


//注册
async function register(){

let name=username.value;

let pwd=password.value;


if(!name||!pwd){

msg.innerHTML="请输入账号密码";

return;

}


let {data}=await db
.from("profiles")
.select("*")
.eq("username",name)
.single();


if(data){

msg.innerHTML="账号已存在";

return;

}


await db
.from("profiles")
.insert({

username:name,

password:pwd,

role:"user"

});


msg.innerHTML="注册成功";


}


//显示主页
function showApp(){

loginBox.classList.add("hidden");

app.classList.remove("hidden");

userInfo.innerHTML=
profile.username;


if(profile.role==="admin"){

adminBtn.classList.remove("hidden");

}


loadHome();

}


//退出
function logout(){

localStorage.removeItem("user");

location.reload();

}


//加载首页
async function loadHome(){

let {data}=await db
.from("settings")
.select("*")
.limit(1)
.single();


if(data){

siteTitle.innerHTML=
data.site_title||"CMS";

notice.innerHTML=
data.announcement||"";

}


let result=
await db
.from("sections")
.select("*,contents(*)")
.order("sort");


sections.innerHTML="";


(result.data||[]).forEach(s=>{

sections.innerHTML+=`

<div class="card">

<h2>${s.title}</h2>

${(s.contents||[])
.map(c=>"<p>"+c.title+"</p>")
.join("")}

</div>

`;

});


}


//自动恢复
window.onload=function(){

let save=
localStorage.user;


if(save){

profile=
JSON.parse(save);

showApp();

}

}

</script>

</body>
</html>
