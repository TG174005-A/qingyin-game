<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CMS Platform V6 FINAL INTEGRATED</title>
<link rel="manifest" href="manifest.json">
<meta name="description" content="CMS内容管理平台">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",Arial;background:#f1f5f9;margin:0}
.card{background:#fff;margin:15px;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0002}
button{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}
input,textarea,select{width:100%;padding:10px;margin:5px 0;border-radius:8px}
.hidden{display:none}
.dark{background:#111;color:#fff}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>CMS Platform V6 Final</h2>
<input id="username" placeholder="账号">
<input id="password" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<button onclick="register()">注册</button>
<p id="msg"></p>
</div>

<div id="app" class="hidden">
<div class="card">
<h2 id="siteTitle">CMS</h2>
<span id="userInfo"></span>
<button onclick="logout()">退出</button>
<button onclick="toggleTheme()">主题</button>
<button onclick="openAdmin()" id="adminBtn" class="hidden">后台</button>
</div>

<div class="card">
<input id="searchBox" placeholder="搜索内容">
<button onclick="searchContent()">搜索</button>
<button onclick="shareQR()">分享</button>
</div>

<div id="sections"></div>

<div class="card">
<h3>评论</h3>
<textarea id="commentText"></textarea>
<button onclick="sendComment()">发表评论</button>
<div id="comments"></div>
</div>

<div class="card">
<h3>个人中心</h3>
<div id="profileBox"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://pnqlhpwfkqonhyrtgrha.supabase.co";
const SUPABASE_KEY="sb_publishable_u1KUB7-FCV7OBzToH8CBbA_qsYY9ZcQ";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null;

async function login(){
const {data,error}=await db.from("profiles").select("*")
.eq("username",username.value)
.eq("password",password.value)
.maybeSingle();
if(error||!data){msg.innerHTML="账号或密码错误";return}
profile=data;
localStorage.profile=JSON.stringify(data);
showApp();
}

async function register(){
await db.from("profiles").insert({
username:username.value,
password:password.value,
role:"user"
});
msg.innerHTML="注册成功";
}

function showApp(){
loginBox.classList.add("hidden");
app.classList.remove("hidden");
userInfo.innerHTML="用户："+profile.username;
profileBox.innerHTML="权限："+profile.role;
if(profile.role==="admin") adminBtn.classList.remove("hidden");
loadHome();
}

function logout(){
localStorage.removeItem("profile");
location.reload();
}

async function loadHome(){
const {data}=await db.from("sections").select("*,contents(*)").order("sort");
sections.innerHTML="";
(data||[]).forEach(s=>{
sections.innerHTML+=`<div class="card"><h2>${s.title}</h2>${(s.contents||[]).map(c=>"<p>"+c.title+"</p>").join("")}</div>`;
});
}

async function searchContent(){
const {data}=await db.from("contents").select("*")
.ilike("title","%"+searchBox.value+"%");
sections.innerHTML=(data||[]).map(c=>"<div class='card'>"+c.title+"</div>").join("");
}

async function sendComment(){
await db.from("comments").insert({
user_id:profile.id,
content:commentText.value
});
commentText.value="";
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

async function shareQR(){
let canvas=document.createElement("canvas");
await QRCode.toCanvas(canvas,location.href);
document.body.appendChild(canvas);
}

function openAdmin(){
alert("管理员后台入口");
}

if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

window.onload=()=>{
let p=localStorage.profile;
if(p){profile=JSON.parse(p);showApp();}
}
</script>
</body>
</html>
