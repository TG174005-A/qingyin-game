<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CMS Platform V6 FINAL COMPLETE v33</title>
<link rel="manifest" href="manifest.json">
<meta name="description" content="CMS内容管理平台">
<meta name="keywords" content="CMS,内容管理,资源分享">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:"Microsoft YaHei";background:#f1f5f9;margin:0}
.card{background:#fff;margin:15px;padding:20px;border-radius:16px}
button{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:8px}
input{width:100%;padding:10px;margin:5px 0}
.hidden{display:none}
.tag{display:inline-block;padding:5px 10px;background:#eee;margin:3px;border-radius:8px}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>CMS Platform V6</h2>
<input id="username" placeholder="账号">
<input id="password" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<button onclick="register()">注册</button>
<p id="msg"></p>
</div>

<div id="app" class="hidden">
<div class="card">
<h2 id="siteTitle">CMS Platform</h2>
<span id="userInfo"></span>
<button onclick="logout()">退出</button>
</div>

<div class="card">
<h3>标签搜索</h3>
<input id="tagInput" placeholder="输入标签">
<button onclick="searchTag()">搜索</button>
</div>

<div id="sections"></div>
</div>

<script>
const SUPABASE_URL="https://pnqlhpwfkqonhyrtgrha.supabase.co";
const SUPABASE_KEY="sb_publishable_u1KUB7-FCV7OBzToH8CBbA_qsYY9ZcQ";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null;

async function login(){
let {data,error}=await db.from("profiles").select("*")
.eq("username",username.value)
.eq("password",password.value)
.maybeSingle();

if(error||!data){msg.innerHTML="账号或密码错误";return}
profile=data;
localStorage.profile=JSON.stringify(data);
showApp();
}

async function register(){
await db.from("profiles").insert({
username:username.value,
password:password.value,
role:"user"
});
msg.innerHTML="注册成功";
}

function showApp(){
loginBox.classList.add("hidden");
app.classList.remove("hidden");
userInfo.innerHTML="用户："+profile.username;
loadHome();
}

function logout(){
localStorage.removeItem("profile");
location.reload();
}

async function loadHome(){
let {data}=await db.from("sections").select("*,contents(*)").order("sort");
sections.innerHTML="";
(data||[]).forEach(s=>{
sections.innerHTML+=`
<div class="card">
<h2>${s.title}</h2>
${(s.contents||[]).map(c=>`
<p>${c.title}</p>
`).join("")}
</div>`;
});
}

async function searchTag(){
let tag=tagInput.value;
let {data}=await db.from("contents")
.select("*")
.contains("tags",[tag]);

sections.innerHTML=(data||[]).map(c=>`
<div class="card">
<h3>${c.title}</h3>
<span class="tag">${tag}</span>
</div>
`).join("");
}

window.onload=()=>{
let p=localStorage.profile;
if(p){
profile=JSON.parse(p);
showApp();
}
}
</script>
</body>
</html>
