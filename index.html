

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>清音 V19-P0Fix｜安全修复完整版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--global-opacity:1;--primary:#00ffff;--danger:#ff4466;--bg:#020617;--card:#ffffff08}
body{margin:0;padding-top:42px;padding-bottom:80px;min-height:100vh;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;background-repeat:no-repeat;background-size:cover;background-position:center;overflow-x:hidden;opacity:var(--global-opacity);transition:opacity .35s}
button,input,select,textarea{padding:12px 10px;margin:6px 4px;border-radius:12px;background:#ffffff18;color:#fff;border:1px solid var(--primary);font-size:16px;touch-action:manipulation}
button{cursor:pointer;min-height:44px;transition:.2s}
button:hover{filter:brightness(1.1)}
button.danger{border-color:var(--danger);color:#ff8899;background:#ff22441a}
button:disabled{opacity:.4;cursor:not-allowed}
#adminBtn{display:none;position:fixed;right:16px;top:16px;z-index:99}
#logoutBtn{display:none;position:fixed;right:16px;top:64px;z-index:99}
#bannerWrap{position:fixed;left:0;top:0;width:100%;height:40px;z-index:9998;overflow:hidden;background:#000c;will-change:transform}
#bannerTrack{height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.banner-item{display:inline-flex;align-items:center;padding:0 32px;height:100%;gap:8px}
.banner-item-text{font-size:clamp(13px,2vw,16px)}
.banner-item-img{height:28px;width:auto;object-fit:contain;border-radius:4px}
.banner-item-video{height:32px;width:auto;border-radius:4px}
#bottomUploadBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:998;padding:14px 32px;font-size:17px}
#bottomProfileBtn{position:fixed;left:16px;bottom:24px;z-index:999;padding:12px 20px}
#panel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1400px,96vw);height:min(900px,92vh);border-radius:24px;border:1px solid var(--primary);background:#111d;z-index:999;overflow:hidden;flex-direction:row}
#panel-sidebar{width:240px;flex-shrink:0;border-right:1px solid #00ffff33;padding:20px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
#panel-sidebar h3{margin:4px 0 16px;text-align:center;color:var(--primary)}
.sidebar-item{width:100%;text-align:left}
#panel-content{flex:1;padding:20px;overflow-y:auto}
.panel-close-wrap{position:absolute;right:16px;top:12px;z-index:10}
.card{border:1px solid #00ffff33;border-radius:16px;padding:16px;margin-bottom:16px;background:var(--card)}
.card h3{margin-top:0;color:var(--primary);border-bottom:1px solid #00ffff22;padding-bottom:8px;margin-bottom:12px}
.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:12px 0 24px}
.resource-card{border:1px solid #00ffff33;border-radius:14px;overflow:hidden;background:var(--card);transition:.2s}
.resource-card:hover{transform:translateY(-4px);border-color:var(--primary)}
.res-thumb-box{height:140px;background:#0008;display:flex;align-items:center;justify-content:center;overflow:hidden}
.res-thumb-box img,.res-thumb-box video{width:100%;height:100%;object-fit:cover}
.res-thumb-box .icon-text{font-size:42px;color:var(--primary)}
.res-info{padding:10px}
.res-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-meta{font-size:12px;color:#aaa;margin-top:4px}
.res-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.res-actions button{margin:0;padding:6px 8px;font-size:12px;min-height:30px}
.media-item,.zone-item,.banner-admin-item{border:1px solid #00ffff22;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow-x:auto;max-height:420px;contain:layout}
#users table,#logs table{width:100%;border-collapse:collapse;min-width:600px}
#users td,#logs td,#users th,#logs th{border:1px solid #00ffff33;padding:10px 12px}
#users tr:nth-child(even),#logs tr:nth-child(even){background:#00ffff0a}
.zone-container{position:absolute;border:1px dashed #00ffff88;background:#00ffff0f;border-radius:16px;overflow:hidden}
.area{position:absolute;border:1px solid var(--primary);background:#ffffff18;resize:both;overflow:hidden}
.area.drag-enabled{cursor:move}
.area img,.area video{object-fit:cover;width:100%;height:100%}
#loginBox,#homeBox{background-repeat:no-repeat;background-size:cover;background-color:var(--bg);background-position:center}
#loginBox{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 20px;gap:12px}
#loginBox h1{margin-bottom:30px;font-size:clamp(28px,5vw,52px)}
#loginBox input{width:min(420px,90vw);height:48px;font-size:16px}
#loginBox button{width:min(420px,90vw);height:48px}
#homeBox{min-height:100vh;padding:20px;display:block;position:relative;overflow:visible}
.toast-container{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#00ffff33;border:1px solid var(--primary);padding:10px 24px;border-radius:12px;animation:toastIn .25s}
.toast.err{border-color:var(--danger);background:#ff224422}
.toast.warn{background:#ffaa0022;border-color:#ffaa00}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
#modalMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999}
#userUploadModal,#publicChatModal,#webgameRunModal,#profileModal,#passwordModal,#noticeModal{z-index:10000}
#userUploadModal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);border-radius:18px;border:1px solid var(--primary);background:#111d;padding:20px;max-height:88vh;overflow:auto}
#publicChatModal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,92vw);height:min(620px,80vh);background:#0b1220f2;border:1px solid var(--primary);border-radius:18px;flex-direction:column;overflow:hidden}
.public-chat-head{padding:12px 16px;background:#00ffff22;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ffff44}
.public-chat-box{flex:1;overflow-y:auto;padding:12px;contain:layout}
.public-chat-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid #00ffff33}
.public-chat-input-area input{flex:1;margin:0}
.chat-message{margin-bottom:10px;word-break:break-word}
.chat-sender{color:var(--primary);font-weight:bold;margin-right:6px}
.chat-time{font-size:11px;color:#777;margin-left:6px}
#webgameRunModal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,1100px);height:min(85vh,820px);background:#000;border:1px solid var(--primary);border-radius:18px;overflow:hidden}
.webgame-head{padding:10px 14px;background:#00ffff22;display:flex;justify-content:space-between;align-items:center}
#webgameIframe{width:100%;height:calc(100% - 52px);border:none}
#chatFloatBtn{display:none;position:fixed;right:20px;bottom:90px;z-index:99990;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#001018;border:2px solid var(--primary);font-size:24px;align-items:center;justify-content:center;box-shadow:0 0 18px #00ffff88}
#chatFloatBtn .chat-badge{position:absolute;top:-4px;right:-4px;background:#ff4466;color:#fff;font-size:11px;padding:2px 7px;border-radius:999px;display:none}
#chatModal{display:none;position:fixed;right:16px;bottom:160px;z-index:99991;width:min(380px,92vw);height:min(520px,70vh);background:#0b1220f2;border:1px solid var(--primary);border-radius:16px;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px #000a}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#00ffff22;border-bottom:1px solid #00ffff44}
.chat-head b{color:var(--primary);font-size:15px}
.chat-tabs{display:flex;gap:6px;padding:8px 10px 0;border-bottom:1px solid #223}
.chat-tab-btn{flex:1;padding:8px 4px;font-size:13px;min-height:36px;margin:0;background:#ffffff10;border:1px solid #223;color:#aaa;border-radius:8px}
.chat-tab-btn.active{background:#00ffff22;color:var(--primary);border-color:var(--primary)}
#chatMsgBox{flex:1;overflow-y:auto;padding:10px;font-size:14px;line-height:1.5}
.chat-msg{margin-bottom:8px;word-break:break-word}
.chat-msg .who{color:var(--primary);font-weight:bold;margin-right:6px}
.chat-msg audio{width:100%;margin-top:4px}
.chat-input-area{display:flex;gap:6px;padding:8px;border-top:1px solid #223;align-items:center}
.chat-input-area input[type=text]{flex:1;margin:0;min-width:0}
.tag-badge{position:absolute;top:2px;left:2px;z-index:5;background:#00ffffcc;color:#001018;font-size:11px;padding:2px 8px;border-radius:999px;cursor:pointer;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-download-btn{position:absolute;bottom:2px;right:2px;z-index:5;background:#000c;color:var(--primary);border:1px solid var(--primary);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;display:none}
.area:hover .media-download-btn{display:block}
.area{position:relative}
#noticeModal{display:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10003;background:#111f;border:1px solid var(--primary);border-radius:16px;padding:22px;width:min(440px,90vw);max-height:70vh;overflow-y:auto}
#noticeModal h3{color:var(--primary);margin-bottom:10px}
#noticeModal .notice-body{white-space:pre-wrap;line-height:1.6;margin-bottom:14px}
.database-table{width:100%;overflow:auto;margin:10px 0}
.database-table table{border-collapse:collapse;width:100%}
.database-table td,.database-table th{border:1px solid #00ffff33;padding:8px;white-space:nowrap}
.online-count-card{border:1px solid #00ffff33;border-radius:16px;padding:16px;margin-bottom:16px}
#bgPreviewPanel{display:flex;flex-wrap:wrap;gap:15px}
.bg-preview-item{border:1px solid #00ffff33;border-radius:12px;padding:10px;width:220px;background:var(--card)}
.bg-preview-item img{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-top:8px;background:#000}
.drag-handle{position:absolute;top:0;left:0;right:0;height:22px;background:#00ffff44;cursor:move;display:none}
.area.drag-enabled .drag-handle{display:block}
.upload-progress-bar{height:8px;background:#111;border-radius:4px;overflow:hidden;margin:8px 0}
.upload-progress-fill{height:100%;background:var(--primary);width:0%}
@media(max-width:900px){
  #panel{flex-direction:column;height:94vh}
  #panel-sidebar{width:100%;border-right:none;border-bottom:1px solid #00ffff33;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;gap:6px}
  .sidebar-item{width:auto;flex-shrink:0;min-width:110px}
  .resource-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .area,.drag-handle{cursor:default!important;display:none!important}
}
@media(max-width:768px){
  body{padding-top:36px;padding-bottom:90px}
  #bannerWrap{height:36px}
  .banner-item-img{height:24px}
  .banner-item-video{height:28px}
  #panel{width:96vw;height:94vh}
  #panel-content{padding:12px}
  .zone-container,.area{position:relative!important;width:100%!important;left:auto!important;top:auto!important;margin:10px 0}
  button,input,select{padding:12px 8px;font-size:15px}
  #bottomUploadBtn{bottom:16px}
}
body,#loginBox,#homeBox,#panel{background-repeat:no-repeat!important;background-position:center center!important;background-size:cover!important;background-color:var(--bg)!important}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div id="bannerWrap"><div id="bannerTrack"></div></div>
<div id="topLeftInfo"><span id="webTitle">清音</span><span id="userName"></span></div>
<button id="adminBtn" onclick="openAdmin()">后台管理</button>
<button id="logoutBtn" onclick="logout()">退出登录</button>

<div id="loginBox">
<h1 id="loginPageText">清音</h1>
<input id="account" placeholder="数字账号">
<input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">登录</button>
<button onclick="register()">注册</button>
</div>

<div id="homeBox" style="display:none">
  <div style="margin:12px 0">
    <button onclick="openPublicChat()">💬全局公共聊天</button>
    <button id="toggleLayoutEditBtn" onclick="toggleLayoutEdit()" style="display:none">✏️布局编辑</button>
  </div>
  <h3 style="color:#00ffff;margin:18px 0 8px">资源库｜视频/照片/音乐/软件/网页游戏</h3>
  <div id="resourceGrid" class="resource-grid"></div>
  <div id="layoutCanvas"></div>
</div>

<button id="bottomProfileBtn" onclick="openProfile()">👤个人中心</button>
<button id="bottomUploadBtn" onclick="openUserUploadModal()" style="display:none">📤上传资源</button>
<div id="modalMask"></div>

<div id="userUploadModal">
  <h3>上传资源</h3>
  <label>类型：<select id="uploadResType">
    <option value="image">图片</option><option value="video">视频</option>
    <option value="audio">音乐</option><option value="software">软件包(zip/7z/rar)</option>
    <option value="webgame">网页游戏(html/htm/zip)</option>
  </select></label>
  <input id="userMediaFile" type="file">
  <label>分区：<select id="userTargetZone"></select></label>
  <label>缩略图(可选)：<input id="thumbFile" type="file" accept="image/*"></label>
  <label>宽:<input type="number" id="userContentW" value="220"></label>
  <label>高:<input type="number" id="userContentH" value="160"></label>
  <div class="upload-progress-bar"><div id="uploadProgressFill" class="upload-progress-fill"></div></div>
  <br>
  <button id="btnUserUpload" onclick="userUploadMedia()">提交上传</button>
  <button onclick="closeUserUploadModal()">关闭</button>
</div>

<div id="publicChatModal">
  <div class="public-chat-head">
    <b>🌐全局公共聊天</b>
    <button onclick="closePublicChat()">✕</button>
  </div>
  <div id="publicChatBox" class="public-chat-box"></div>
  <div class="public-chat-input-area">
    <input id="publicChatInput" placeholder="输入发言，所有人可见" onkeydown="if(event.key==='Enter')sendPublicChat()">
    <button onclick="sendPublicChat()">发送</button>
  </div>
</div>

<div id="webgameRunModal">
  <div class="webgame-head">
    <b id="webgameTitle">网页游戏</b>
    <button onclick="closeWebgameModal()">✕</button>
  </div>
  <!-- P0修复：iframe sandbox安全隔离 -->
  <iframe id="webgameIframe" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<div id="panel">
  <div class="panel-close-wrap"><button onclick="closeAdmin()">✕关闭</button></div>
  <div id="panel-sidebar">
    <h3>管理菜单</h3>
    <button class="sidebar-item" onclick="switchTab('tab-user')">👥用户管理</button>
    <button class="sidebar-item" onclick="switchTab('tab-log')">📋操作日志</button>
    <button class="sidebar-item" onclick="switchTab('tab-bg')">🖼背景设置</button>
    <button class="sidebar-item" onclick="switchTab('tab-opacity')">🔳全站透明度</button>
    <button class="sidebar-item" onclick="switchTab('tab-video')">▶全局视频控制</button>
    <button class="sidebar-item" onclick="switchTab('tab-zone')">📦分区管理</button>
    <button class="sidebar-item" onclick="switchTab('tab-banner')">📢跑马灯横幅</button>
    <button class="sidebar-item" onclick="switchTab('tab-res')">📁资源管理</button>
    <button class="sidebar-item" onclick="switchTab('tab-pwd')">🔑修改密码</button>
    <button class="sidebar-item" onclick="switchTab('tab-webname')">🏷网页标题</button>
    <button class="sidebar-item" onclick="switchTab('tab-db')">🗄数据库查看</button>
    <button class="sidebar-item" onclick="switchTab('tab-logintext')">🔤登录页文字</button>
    <button class="sidebar-item" onclick="switchTab('tab-chat-admin')">💬聊天管理</button>
    <button class="sidebar-item" onclick="switchTab('tab-system')">⚙️系统设置</button>
    <button class="sidebar-item" onclick="switchTab('tab-online')">👥在线用户</button>
  </div>
  <div id="panel-content">
    <div class="card online-count-card"><h3>在线人数</h3><div id="onlineCount">0人在线</div></div>
    <div id="tab-user" class="tab-content"><div class="card"><h3>用户管理</h3><div class="table-wrap"><div id="users"></div></div></div></div>
    <div id="tab-log" class="tab-content" style="display:none"><div class="card"><h3>操作日志</h3><div class="table-wrap"><div id="logs"></div></div></div></div>
    <div id="tab-opacity" class="tab-content" style="display:none"><div class="card"><h3>全站透明度</h3>
      <input id="globalOpacityRange" type="range" min="0.2" max="1" step="0.05" value="1" onchange="changeGlobalOpacity(this.value)">
      <span id="globalOpacityValue">100%</span></div></div>
    <div id="tab-video" class="tab-content" style="display:none"><div class="card"><h3>全局视频控制</h3>
      <button onclick="playAllGlobalVideo()">▶全部播放</button>
      <button onclick="pauseAllGlobalVideo()">⏸全部暂停</button></div></div>
    <div id="tab-bg" class="tab-content" style="display:none"><div class="card"><h3>背景上传</h3>
      <input id="bgFile" type="file">
      <select id="bgType"><option value="login_background">登录页背景</option><option value="home_background">主页背景</option><option value="admin_background">后台背景</option></select>
      <button onclick="uploadBg()">保存背景</button>
      <hr style="margin:15px 0;border-color:#00ffff33"><h3>当前背景预览</h3>
      <div id="bgPreviewPanel">
        <div class="bg-preview-item"><div>登录页</div><img id="previewLoginBg"></div>
        <div class="bg-preview-item"><div>主页</div><img id="previewHomeBg"></div>
        <div class="bg-preview-item"><div>后台</div><img id="previewAdminBg"></div>
      </div></div></div>
    <div id="tab-res" class="tab-content" style="display:none"><div class="card"><h3>资源管理</h3><div id="adminAllResourceList"></div></div></div>
    <div id="tab-zone" class="tab-content" style="display:none"><div class="card"><h3>新建分区</h3>
      <label>名称:<input id="zoneNewName"></label><label>X:<input type="number" id="zoneNewX" value="60"></label>
      <label>Y:<input type="number" id="zoneNewY" value="60"></label><label>宽:<input type="number" id="zoneNewW" value="420"></label>
      <label>高:<input type="number" id="zoneNewH" value="320"></label>
      <label><input type="checkbox" id="zoneAllowUserUpload">允许用户上传</label>
      <button onclick="createNewZone()">创建</button></div>
      <div class="card"><h3>分区列表</h3><div id="zoneListWrap"></div></div></div>
    <div id="tab-banner" class="tab-content" style="display:none"><div class="card"><h3>新增横幅</h3>
      <label>类型:<select id="bannerNewType"><option value="text">文字</option><option value="image">图片</option><option value="video">视频</option></select></label>
      <label>内容:<input id="bannerNewText"></label><input id="bannerMediaFile" type="file" accept="image/*,video/*">
      <label>排序:<input type="number" id="bannerNewSort" value="10"></label>
      <label>速度:<input type="number" id="bannerNewSpeed" value="60"></label>
      <label><input type="checkbox" id="bannerNewEnabled" checked>启用</label>
      <br><button onclick="createBannerItem()">新增</button></div>
      <div class="card"><h3>横幅列表</h3><div id="bannerListWrap"></div></div></div>
    <div id="tab-pwd" class="tab-content" style="display:none"><div class="card"><h3>修改密码</h3>
      <input id="newPasswordInput" type="password" placeholder="新密码"><button onclick="changeLoginPassword()">保存</button></div></div>
    <div id="tab-webname" class="tab-content" style="display:none"><div class="card"><h3>网页标题</h3>
      <input id="webNameInput" placeholder="网页名称"><button onclick="saveWebTitle()">保存</button></div></div>
    <div id="tab-db" class="tab-content" style="display:none"><div class="card"><h3>数据库查看</h3>
      <button onclick="loadDatabaseContentManage()">刷新</button><div id="databaseManageViewer"></div></div></div>
    <div id="tab-logintext" class="tab-content" style="display:none"><div class="card"><h3>登录页文字</h3>
      <input id="loginTextInput" placeholder="登录页标题"><button onclick="saveLoginText()">保存</button></div></div>
    <div id="tab-chat-admin" class="tab-content" style="display:none"><div class="card"><h3>聊天管理</h>
      <button class="danger" onclick="adminClearPublicChat()">清空公共聊天</button><hr style="margin:15px 0">
      <h3>全局音频</h3>
      <button onclick="globalAudioCmd('PLAY')">▶全部播放</button>
      <button onclick="globalAudioCmd('PAUSE')">⏸全部暂停</button>
      <button onclick="globalAudioCmd('STOP')">⏹全部停止</button></div></div>
    <div id="tab-system" class="tab-content" style="display:none"><div class="card"><h3>系统设置</h3>
      <label>最大文件MB:<input type="number" id="cfgMaxSizeMB" value="50" style="width:100px"></label>

/* ---------- 文件白名单 ---------- */
const FILE_WL = {
  image:{ext:["jpg","jpeg","png","gif","webp"]},
  video:{ext:["mp4","webm"]},
  audio:{ext:["mp3","wav","ogg"]},
  software:{ext:["zip","7z","rar"]},
  webgame:{ext:["html","htm","zip"]}
};
function checkFile(file, typeKey, maxMB=50){
  const ext = file.name.split(".").pop().toLowerCase();
  const rule = FILE_WL[typeKey];
  if(!rule.ext.includes(ext)){showWarn(`不允许后缀 ${ext}，允许: ${rule.ext.join(",")}`);return false}
  if(file.size > maxMB*1024*1024){showWarn(`文件超过${maxMB}MB限制`);return false}
  return true;
}

  async select(table, cols="*", filter=null){
    try{
      let q = sb.from(table).select(cols);
      if(filter) Object.entries(filter).forEach(([k,v])=>q=q.eq(k,v));
      const {data,error} = await q;
      if(error) throw error;
      return {ok:true, data};
    }catch(e){ showErr(`DB读${table}:${e.message}`); return {ok:false,data:null}; }
  },
  async insert(table, payload){
    try{
      const {data,error} = await sb.from(table).insert(payload).select();
      if(error) throw error;
      return {ok:true,data};
    }catch(e){ showErr(`DB写${table}:${e.message}`); return {ok:false}; }
  },
  async update(table, payload, filter){
    try{
      let q = sb.from(table).update(payload);
      Object.entries(filter).forEach(([k,v])=>q=q.eq(k,v));
      const {error} = await q;
      if(error) throw error;
      return {ok:true};
    }catch(e){ showErr(`DB更新${table}:${e.message}`); return {ok:false}; }
  },
  async remove(table, filter, protectId1=false){
    if(protectId1 && filter?.id===1){showWarn("禁止删除系统配置id=1");return {ok:false}}
    try{
      let q = sb.from(table).delete();
      Object.entries(filter).forEach(([k,v])=>q=q.eq(k,v));
      const {error} = await q;
      if(error) throw error;
      return {ok:true};
    }catch(e){ showErr(`DB删除${table}:${e.message}`); return {ok:false}; }
  },
  async rpc(fn, params){
    try{
      const {data,error} = await sb.rpc(fn, params);
      if(error) throw error;
      return {ok:true,data};
    }catch(e){ showErr(`RPC ${fn}:${e.message}`); return {ok:false}; }

};

/* ---------- ZIP解压 ---------- */
async function unpackZip(file){
  try{
    const zip = await JSZip.loadAsync(file);
    let entry = null;
    for(const k of Object.keys(zip.files)){
      const lk = k.toLowerCase();
      if(lk==="index.html"||lk==="index.htm"){entry=zip.files[k];break}
    }
    if(!entry){showErr("zip内无index.html");return null}
    const html = await entry.async("string");
    return URL.createObjectURL(new Blob([html],{type:"text/html"}));
  }catch(e){showErr("解压失败:"+e.message);return null}
}

/* ---------- 视频自动缩略图 ---------- */
function videoThumb(videoFile){
  return new Promise(res=>{
    const v = document.createElement("video");
    v.src = URL.createObjectURL(videoFile); v.muted=true;
    v.onloadeddata = ()=>{
      v.currentTime = 0.5;
      v.onseeked = ()=>{
        const c = document.createElement("canvas"); c.width=320; c.height=180;
        c.getContext("2d").drawImage(v,0,0,320,180);
        c.toBlob(b=>{URL.revokeObjectURL(v.src);res(b)},"image/jpeg",0.8);
      };
    };
  });
}

async function userUploadMedia(){

  const zoneId = document.getElementById("userTargetZone").value;

  if(!zoneId){showWarn("请选分区");return}
  if(!checkFile(file,resType))return;
  const btn = document.getElementById("btnUserUpload");
  const bar = document.getElementById("uploadProgressFill");
  btn.disabled = true;
  try{
    let folder = "media";
    if(resType==="software")folder="software";
    if(resType==="webgame")folder="webgame";
    let fileUrl;
    if(resType==="webgame" && file.name.toLowerCase().endsWith(".zip")){
      fileUrl = await unpackZip(file);
      if(!fileUrl)return;
    }else{
      const path = folder+"/"+Date.now()+"_"+file.name;
      const {error} = await sb.storage.from("media").upload(path,file,{upsert:true});
      if(error)throw error;
      fileUrl = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    }
    let thumbUrl = "";
    const thumbFile = document.getElementById("thumbFile").files[0];
    if(thumbFile){
      const tp = "thumbnails/"+Date.now()+"_"+thumbFile.name;
      await sb.storage.from("media").upload(tp,thumbFile,{upsert:true});
      thumbUrl = sb.storage.from("media").getPublicUrl(tp).data.publicUrl;
    }
    if(resType==="video"&&!thumbUrl){
      const tb = await videoThumb(file);
      const tp = "thumbnails/auto_"+Date.now()+".jpg";
      await sb.storage.from("media").upload(tp,tb,{upsert:true});
      thumbUrl = sb.storage.from("media").getPublicUrl(tp).data.publicUrl;
    }
    const row = {type:resType,url:fileUrl,zone_id:Number(zoneId),content_width:cw,content_height:ch,x:20,y:20,width:cw,height:ch,uploader_username:currentUser,name:file.name,auto_thumb_url:thumbUrl};
    await db.insert("media_playlist",row);
    await db.insert("custom_layouts",{...row,content:fileUrl});
    showTip("上传成功");
    closeUserUploadModal();
    debouncedRefresh();
  }catch(e){showErr("上传失败:"+e.message)}

}

/* ---------- 数据库查看 ---------- */
const DB_TABLES = ["account_store","system_settings","banner_messages","custom_zones","custom_layouts","media_playlist","admin_logs","online_users","private_messages","layout_controls"];
async function loadDatabaseContentManage(){
  if(!checkSuperAdmin())return;
  const viewer = document.getElementById("databaseManageViewer");
  viewer.innerHTML = "加载中...";
  let html = "";
  for(const t of DB_TABLES){
    const r = await db.select(t);
    if(!r.ok) continue;
    const rows = r.data||[];
    html += `<div class="database-table"><h4>${t} (${rows.length}行)</h4>`;
    if(rows.length){
      const cols = Object.keys(rows[0]);
      html += "<table><tr>"+cols.map(c=>`<th>${c}</th><th>操作</th>`).join("")+"</tr>";
      rows.forEach(row=>{
        html += "<tr>"+cols.map(c=>`<td>${safeText(typeof row[c]==="object"?JSON.stringify(row[c]).slice(0,80):row[c])}</td>`).join("")+
          `<td><button class="danger" onclick="delDbRow('${t}',${row.id},${t==='system_settings'&&row.id===1})">删除</button></td></tr>`;
      });
      html += "</table>";
    }
    html += "</div>";
  }
  viewer.innerHTML = html;
}
async function delDbRow(table, id, protected_row){
  if(!checkSuperAdmin())return;
  if(protected_row){showWarn("禁止删除系统配置行");return}
  if(!confirm(`⚠️确定永久删除 ${table} 表 id=${id} 的记录？此操作不可恢复！`))return;
  await db.remove(table,{id}, table==="system_settings");
  showTip("已删除"); loadDatabaseContentManage();
}

/* ---------- 在线用户 ---------- */
async function startOnline(){
  const beat = async ()=>{
    if(!currentUser)return;
    try{
      const now = new Date().toISOString();
      const {error:updateError} = await sb
        .from("online_users")
        .update({last_active: now})
        .eq("username", currentUser);

      if(updateError) throw updateError;

      const {data:exists} = await sb
        .from("online_users")
        .select("username")
        .eq("username", currentUser)
        .limit(1);

      if(!exists || exists.length===0){
        const {error:insertError} = await sb
          .from("online_users")
          .insert({
            username: currentUser,
            last_active: now
          });
        if(insertError) throw insertError;
      }
    }catch(e){
      showErr("在线状态更新失败:"+e.message);
    }
  };
  await beat();
  setInterval(beat, 30000);
}

/* ---------- 拖拽布局 P0修复#4: mouseup才写DB ---------- */
function toggleLayoutEdit(){
  layoutEditMode = !layoutEditMode;
  document.querySelectorAll(".area").forEach(a=>a.classList.toggle("drag-enabled",layoutEditMode));
  document.getElementById("toggleLayoutEditBtn").textContent = layoutEditMode?"✅退出编辑":"✏️布局编辑";
  showTip(layoutEditMode?"拖拽模式已开启":"拖拽模式已关闭");
}
function enableDrag(el, recordId){
  let startX, startY, origX, origY, moved=false;
  el.addEventListener("mousedown", e=>{
    if(!layoutEditMode)return;
    e.preventDefault();
    startX = e.clientX; startY = e.clientY;
    origX = parseInt(el.style.left)||0; origY = parseInt(el.style.top)||0;
    moved = false;
    const onMove = ev=>{
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if(Math.abs(dx)>2||Math.abs(dy)>2) moved = true;
      el.style.left = (origX+dx)+"px";
      el.style.top = (origY+dy)+"px";
    };
    const onUp = async ()=>{
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      /* P0修复#4: 只在mouseup时写一次数据库，mousemove不写 */
      if(moved && recordId){
        await db.update("media_playlist",{
          x:parseInt(el.style.left), y:parseInt(el.style.top)
        },{id:recordId});
        showTip("位置已保存");
      }
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

/* ---------- 布局渲染 ---------- */
async function renderLayout(){
  const canvas = document.getElementById("layoutCanvas");
  canvas.innerHTML = "";
  const zones = await db.select("custom_zones");
  if(zones.ok&&zones.data){
    zones.data.forEach(z=>{
      const zd = document.createElement("div");
      zd.className = "zone-container";
      zd.style.cssText = `left:${z.x}px;top:${z.y}px;width:${z.width}px;height:${z.height}px`;
      zd.innerHTML = `<div style="padding:6px;font-size:12px;color:#00ffff">${safeText(z.name||"分区")}</div>`;
      canvas.appendChild(zd);
    });
  }
  const items = await db.select("media_playlist");
  if(items.ok&&items.data){
    items.data.forEach(item=>{
      const el = document.createElement("div");
      el.className = "area";
      el.style.cssText = `left:${item.x||20}px;top:${item.y||20}px;width:${item.content_width||220}px;height:${item.content_height||160}px`;
      let inner = `<div class="drag-handle"></div>`;
      if(item.type==="image") inner += `<img src="${item.url}">`;
      else if(item.type==="video") inner += `<video muted src="${item.url}"></video>`;
      else inner += `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:36px">${item.type==="audio"?"🎵":item.type==="software"?"📦":"🎮"}</div>`;
      el.innerHTML = inner;
      canvas.appendChild(el);
      enableDrag(el, item.id);
    });
  }
}

/* ---------- Realtime P0修复#5: 防抖去重 ---------- */
function debouncedRefresh(){
  if(refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(()=>refreshAll(), 500);
}
function startRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("db_global")
    .on("postgres_changes",{event:"*",schema:"public"},()=>debouncedRefresh())
    .subscribe();
}

    loadSettings(),
    renderBanner(),
    renderResourceGrid(),
    renderLayout(),

    renderBannerList(),
    renderZoneList(),
    renderUsers(),

  ]);
}
