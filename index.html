<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 恋恋空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background-color: #fff5f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* 爱心粒子容器 */
        #heartBg {
            position: fixed;
            inset:0;
            z-index:0;
            pointer-events: none;
        }
        .heart {
            position:absolute;
            color:#ff789c;
            animation: float 6s linear infinite;
            opacity:0.6;
        }
        @keyframes float {
            0% {
                bottom:-20px;
                left:var(--x);
                opacity:0.6;
                transform:rotate(0deg);
            }
            100% {
                bottom:100vh;
                opacity:0;
                transform:rotate(360deg);
            }
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 8px 24px rgba(255, 105, 160, 0.18);
            z-index: 10;
        }
        h1 {
            text-align: center;
            color: #ff4785;
            font-size: 32px;
            margin-bottom: 36px;
            font-weight: bold;
        }
        .input-item {
            margin-bottom: 20px;
            position:relative;
        }
        .input-item input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #ffb8cc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
        }
        .input-item input::placeholder {
            color: #ff96ad;
        }
        .input-item input:focus {
            border-color: #ff4785;
            box-shadow: 0 0 0 3px rgba(255,71,133,0.12);
        }
        .error-text{
            color:#ff3333;
            font-size:14px;
            margin-top:6px;
            display:none;
        }
        .input-item.error input{
            border-color:#ff3333;
        }
        .input-item.error .error-text{
            display:block;
        }
        .pwd-toggle{
            position:absolute;
            right:14px;
            top:13px;
            cursor:pointer;
            color:#ff789c;
        }
        .btn-group {
            display: flex;
            gap:12px;
            margin-top: 28px;
        }
        button {
            flex: 1;
            padding:13px;
            border: none;
            border-radius: 10px;
            font-size:16px;
            cursor: pointer;
            transition:0.2s;
            font-weight: 500;
        }
        .btn-login {
            background-color: #ff4785;
            color:white;
        }
        .btn-login:hover {
            background-color: #e63a74;
        }
        .btn-register {
            background-color: #ff87a8;
            color:white;
        }
        .btn-register:hover {
            background-color: #ff6891;
        }
        /* 弹窗toast */
        .toast{
            position:fixed;
            top:30px;
            left:50%;
            transform:translateX(-50%);
            padding:12px 24px;
            background:#333;
            color:#fff;
            border-radius:8px;
            z-index:100;
            display:none;
        }
        /* 欢迎页面 */
        .welcome-page{
            display:none;
            text-align:center;
        }
        .welcome-page h2{
            color:#ff4785;
            margin-bottom:20px;
        }
        .welcome-page p{
            color:#666;
            margin-bottom:30px;
        }
        .back-btn{
            background:#ff4785;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            border:none;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div id="heartBg"></div>
    <div class="container" id="loginBox">
        <h1>💕 恋恋空间</h1>
        <div class="input-item">
            <input type="text" id="account" placeholder="账号">
            <div class="error-text">账号至少3个字符</div>
        </div>
        <div class="input-item">
            <input type="password" id="pwd" placeholder="密码">
            <span class="pwd-toggle" id="pwdEye">👁</span>
            <div class="error-text">密码至少6位</div>
        </div>
        <div class="input-item">
            <input type="text" id="nickname" placeholder="注册昵称">
            <div class="error-text">昵称不能为空</div>
        </div>
        <div class="btn-group">
            <button class="btn-login" id="loginBtn">登录并进入</button>
            <button class="btn-register" id="regBtn">注册并进入</button>
        </div>
    </div>
    <div class="container welcome-page" id="welcomeBox">
        <h2>欢迎来到恋恋空间 💕</h2>
        <p id="welcomeNick"></p>
        <button class="back-btn" id="backBtn">返回登录页</button>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        //爱心粒子生成
        const heartBg = document.getElementById('heartBg');
        function createHeart(){
            const h = document.createElement('div');
            h.innerText = '♥';
            h.className = 'heart';
            h.style.setProperty('--x', Math.random()*100 + '%');
            h.style.fontSize = (Math.random()*18+8)+'px';
            heartBg.appendChild(h);
            setTimeout(()=>h.remove(),6000);
        }
        setInterval(createHeart,400);

        //元素
        const accountEl = document.getElementById('account');
        const pwdEl = document.getElementById('pwd');
        const nickEl = document.getElementById('nickname');
        const pwdEye = document.getElementById('pwdEye');
        const loginBtn = document.getElementById('loginBtn');
        const regBtn = document.getElementById('regBtn');
        const loginBox = document.getElementById('loginBox');
        const welcomeBox = document.getElementById('welcomeBox');
        const welcomeNick = document.getElementById('welcomeNick');
        const backBtn = document.getElementById('backBtn');
        const toast = document.getElementById('toast');

        //密码显示隐藏
        pwdEye.onclick = ()=>{
            if(pwdEl.type === 'password'){
                pwdEl.type = 'text';
                pwdEye.innerText = '🙈';
            }else{
                pwdEl.type = 'password';
                pwdEye.innerText = '👁';
            }
        }

        //清除报错
        function clearError(){
            document.querySelectorAll('.input-item').forEach(el=>el.classList.remove('error'))
        }
        //校验表单
        function checkForm(){
            clearError();
            let ok = true;
            if(accountEl.value.trim().length <3){
                accountEl.parentElement.classList.add('error');
                ok = false;
            }
            if(pwdEl.value.length <6){
                pwdEl.parentElement.classList.add('error');
                ok = false;
            }
            if(nickEl.value.trim() === ''){
                nickEl.parentElement.classList.add('error');
                ok = false;
            }
            return ok;
        }
        //弹窗提示
        function showToast(msg){
            toast.innerText = msg;
            toast.style.display='block';
            setTimeout(()=>toast.style.display='none',1500);
        }
        //切换欢迎页
        function goWelcome(nick){
            loginBox.style.display='none';
            welcomeBox.style.display='block';
            welcomeNick.innerText = `你好，${nick}，很高兴遇见你`;
            localStorage.setItem("currentNick", nick);
        }
        //返回登录
        backBtn.onclick = ()=>{
            loginBox.style.display='block';
            welcomeBox.style.display='none';
            localStorage.removeItem("currentNick");
        }

        //账号存储相关
        function getUserList(){
            const userStr = localStorage.getItem("loveSpaceUser");
            return userStr ? JSON.parse(userStr) : [];
        }
        function saveUserList(list){
            localStorage.setItem("loveSpaceUser", JSON.stringify(list));
        }

        //页面加载，读取上次登录昵称
        window.onload = ()=>{
            const savedNick = localStorage.getItem("currentNick");
            if(savedNick){
                goWelcome(savedNick);
            }
        }

        //登录逻辑
        loginBtn.onclick = ()=>{
            if(!checkForm()) return showToast("请完善表单信息");
            const account = accountEl.value.trim();
            const password = pwdEl.value;
            const userList = getUserList();
            //查找匹配账号
            const findUser = userList.find(u=>u.account === account);
            if(!findUser){
                return showToast("账号不存在，请先注册！");
            }
            if(findUser.password !== password){
                return showToast("密码错误！");
            }
            //登录成功，填充昵称
            nickEl.value = findUser.nickname;
            showToast("登录成功！");
            setTimeout(()=>goWelcome(findUser.nickname),1000);
        }

        //注册逻辑
        regBtn.onclick = ()=>{
            if(!checkForm()) return showToast("请完善表单信息");
            const account = accountEl.value.trim();
            const password = pwdEl.value;
            const nickname = nickEl.value.trim();
            const userList = getUserList();
            //账号重复检测
            const exist = userList.some(u=>u.account === account);
            if(exist){
                return showToast("该账号已经注册，请换账号！");
            }
            //新增用户
            userList.push({account,password,nickname});
            saveUserList(userList);
            showToast("注册成功！可以直接登录");
            setTimeout(()=>goWelcome(nickname),1000);
        }
    </script>
</body>
</html>
