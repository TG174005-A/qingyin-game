<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网页管理系统 - 自适应版</title>
<style>
.area h2{display:none;}

*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;padding:0;font-family:"Microsoft YaHei",Arial,sans-serif}
body{
background:#ddd;
background-size:cover;
background-position:center;
overflow-x:hidden;
}
#app{
width:100%;
min-height:100vh;
background:rgba(255,255,255,.85);
transition:.3s;
}
header{
width:100%;
min-height:60px;
padding:12px 20px;
background:#222;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
}
header div{display:flex;align-items:center;flex-wrap:wrap;gap:5px}

button{
padding:9px 15px;
border:0;
border-radius:6px;
background:#1677ff;
color:white;
cursor:pointer;
font-size:14px;
}

input,select{
width:100%;
max-width:100%;
padding:10px;
margin:5px 0;
border:1px solid #ccc;
border-radius:6px;
}

.area{
width:calc(100% - 30px);
margin:15px;
padding:20px;
background:rgba(255,255,255,.75);
border-radius:12px;
min-height:120px;
overflow:hidden;
word-break:break-word;
}

#loginBox{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.panel{
width:100%;
max-width:380px;
background:white;
padding:25px;
border-radius:15px;
}

#admin{
display:none;
position:fixed;
right:15px;
top:75px;
width:calc(100% - 30px);
max-width:400px;
max-height:85vh;
overflow:auto;
background:white;
padding:20px;
border-radius:15px;
z-index:200;
box-shadow:0 0 20px #0005;
}

img,video{
display:inline-block;
width:auto;
max-width:100%;
height:auto;
max-height:400px;
margin:8px;
border-radius:10px;
}

@media(max-width:600px){

header{
padding:12px;
font-size:16px;
}

header div{
width:100%;
justify-content:flex-start;
}

.area{
width:calc(100% - 20px);
margin:10px;
padding:15px;
}

button{
font-size:13px;
padding:8px 12px;
}

#admin{
left:10px;
right:10px;
width:auto;
top:65px;
}

.panel{
padding:20px;
}

}

@media(min-width:1200px){

.area{
max-width:1400px;
margin:15px auto;
}

}
</style>
</head>

<body>

<div id="loginBox">
<div class="panel">
<h2>用户登录</h2>
<input id="loginName" placeholder="账号">
<input id="loginPwd" type="password" placeholder="密码">
<button onclick="login()">登录</button>

<h3>注册普通账户</h3>
<input id="regName" placeholder="账号">
<input id="regPwd" type="password" placeholder="密码">
<button onclick="register()">注册</button>

<p id="message"></p>
</div>
</div>


<div id="app">

<header>
<b>我的网页</b>
<div>
<span id="userShow"></span>
<button id="adminBtn" style="display:none" onclick="showAdmin()">后台</button>
</div>
</header>


<div class="area">
<h2>上区</h2>
</div>

<div class="area">
<h2>中区</h2>
<div id="mediaShow"></div>
</div>

<div class="area">
<h2>下区</h2>
</div>

</div>


<div id="admin">

<h2>最高权限后台</h2>

<button onclick="hideAdmin()">关闭</button>

<h3>网页背景</h3>
<input id="bgInput" type="file">
<button onclick="setBackground()">修改背景</button>

<h3>透明度</h3>
<input id="opacityInput" type="number" min="1" max="100" value="85">
<button onclick="setOpacity()">调整</button>

<h3>图片/视频管理</h3>
<input id="uploadInput" type="file" accept="image/*,video/*">
<button onclick="upload()">上传</button>

<div id="adminList"></div>

</div>


<script>

const ADMIN={
name:"306680070",
pwd:"Aa112211",
role:"admin"
};

let users=JSON.parse(localStorage.users||"[]");
let files=JSON.parse(localStorage.files||"[]");

function register(){

let n=regName.value;
let p=regPwd.value;

if(!n||!p)return;

users.push({
name:n,
pwd:p,
role:"user"
});

localStorage.users=JSON.stringify(users);

alert("注册成功");

}


function login(userAuto=null){

let n=userAuto ? userAuto.name : loginName.value;
let p=userAuto ? userAuto.pwd : loginPwd.value;

let user =
(n===ADMIN.name && p===ADMIN.pwd)
? ADMIN
: users.find(x=>x.name===n && x.pwd===p);

if(!user){
message.innerHTML="账号或密码错误";
return;
}

localStorage.loginUser=JSON.stringify(user);

loginBox.style.display="none";
userShow.innerHTML="用户："+user.name;

if(user.role==="admin")
adminBtn.style.display="inline-block";

render();

}


function render(){

mediaShow.innerHTML="";

files.forEach(f=>{

if(f.type.startsWith("image"))

mediaShow.innerHTML+=`<img src="${f.url}">`;

else

mediaShow.innerHTML+=`<video controls src="${f.url}"></video>`;

});

}


function showAdmin(){

admin.style.display="block";
adminList.innerHTML="当前文件数量："+files.length;

}

function hideAdmin(){

admin.style.display="none";

}


function upload(){

let file=uploadInput.files[0];

if(!file)return;

let r=new FileReader();

r.onload=e=>{

files.push({
url:e.target.result,
type:file.type
});

localStorage.files=JSON.stringify(files);

render();

};

r.readAsDataURL(file);

}


function setBackground(){

let f=bgInput.files[0];

if(!f)return;

let r=new FileReader();

r.onload=e=>{

document.body.style.backgroundImage=
"url("+e.target.result+")";

localStorage.bg=e.target.result;

};

r.readAsDataURL(f);

}


if(localStorage.bg)
document.body.style.backgroundImage=
"url("+localStorage.bg+")";

window.addEventListener("load",()=>{
let saved=localStorage.getItem("loginUser");
if(saved){
try{
login(JSON.parse(saved));
}catch(e){}
}

let savedOpacity=localStorage.getItem("pageOpacity");
if(savedOpacity){
document.getElementById("app").style.opacity=savedOpacity/100;
}
});


function setOpacity(){

let savedUser = JSON.parse(localStorage.getItem("loginUser") || "null");

if(!savedUser || savedUser.role !== "admin"){
alert("只有最高权限账户可以修改网页透明度");
return;
}

let value = Math.max(1,Math.min(100,Number(opacityInput.value)));

document.getElementById("app").style.opacity = value/100;

localStorage.pageOpacity=value;

}

function logout(){
localStorage.removeItem("loginUser");
location.reload();
}


</script>

</body>
</html>
