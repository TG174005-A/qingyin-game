<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CMS Platform V7 FINAL RESPONSIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#222}
img{max-width:100%}
button{border:0;border-radius:10px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
.container{max-width:1200px;margin:auto;padding:15px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 6px 20px #0001}
.header{position:sticky;top:0;background:#fff;z-index:20;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.cover{width:100%;height:180px;object-fit:cover;border-radius:14px}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#111827;color:#fff;padding:20px;z-index:100;transition:.3s}
.sidebar.active{left:0}
.sidebar button{width:100%;margin:5px 0;background:#374151}
.mask{display:none;position:fixed;inset:0;background:#0006;z-index:90}
.mask.active{display:block}
.mobile-nav{display:none}
@media(max-width:768px){
.header h2{font-size:18px}
.container{padding:10px}
.grid{grid-template-columns:1fr}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px;justify-content:space-around;z-index:50;box-shadow:0 -2px 10px #0002}
.mobile-nav button{padding:8px 12px;font-size:13px}
.sidebar{width:85%}
}
@media(min-width:769px){
.mobile-nav{display:none}
}
</style>
</head>
<body>

<div class="header">
<h2 id="siteTitle">CMS Platform</h2>
<div class="user">
<img id="avatar" class="avatar">
<span id="userName"></span>
<button id="adminBtn" style="display:none">后台</button>
</div>
</div>

<div id="mask" class="mask"></div>
<div id="sidebar" class="sidebar">
<h2>管理后台</h2>
<button>Dashboard</button>
<button>网站设置</button>
<button>区域管理</button>
<button>内容管理</button>
<button>用户管理</button>
<button>文件中心</button>
<button>日志管理</button>
</div>

<div class="container">
<div class="card" id="notice"></div>
<div id="content" class="grid"></div>
</div>

<div class="mobile-nav">
<button>首页</button>
<button>搜索</button>
<button>发布</button>
<button>我的</button>
</div>

<script>
const db=supabase.createClient(
"https://pnqlhpwfkqonhyrtgrha.supabase.co",
"sb_publishable_u1KUB7-FCV7OBzToH8CBbA_qsYY9ZcQ"
);

async function load(){
let {data:setting}=await db.from("settings").select("*").limit(1).maybeSingle();
if(setting){
siteTitle.innerHTML=setting.site_title||"CMS Platform";
notice.innerHTML=setting.announcement||"";
if(setting.background)document.body.style.backgroundImage="url("+setting.background+")";
}

let {data}=await db.from("contents").select("*").limit(30);
content.innerHTML=(data||[]).map(c=>`
<div class="card">
${c.cover_url?'<img class="cover" src="'+c.cover_url+'">':''}
<h3>${c.title||""}</h3>
<p>${c.description||""}</p>
</div>`).join("");

let u=localStorage.cms_user;
if(u){
let user=JSON.parse(u);
userName.innerHTML=user.username||"";
avatar.src=user.avatar||"";
if(user.role==="admin"||user.role==="owner"){
adminBtn.style.display="block";
adminBtn.onclick=()=>{sidebar.classList.add("active");mask.classList.add("active")}
}
}
}

mask.onclick=()=>{
sidebar.classList.remove("active");
mask.classList.remove("active");
}

load();
</script>
</body>
</html>
