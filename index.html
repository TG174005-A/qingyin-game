<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER AI 素材同步平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#080810;color:#e0f0ff}
#banner{background:#000822;color:#0ff;padding:8px;overflow:hidden;white-space:nowrap;border-bottom:1px solid #0ff4}
#banner-text{display:inline-block;animation:marquee 12s linear infinite;color:#0ff;text-shadow:0 0 8px #0ff}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:#0a0a18;border-bottom:1px solid #0ff4}
header h2{color:#0ff;text-shadow:0 0 6px #0ff}
#headerRight{display:flex;gap:12px;align-items:center}
#userInfo{color:#8cf}
#adminBtn{padding:8px 12px;border:none;border-radius:6px;background:#0055aa;color:#fff;cursor:pointer;border:1px solid #0ff6;display:none}
#logoutBtn{padding:8px 12px;border:none;border-radius:6px;background:#771122;color:#fff;cursor:pointer;border:1px solid #f446;display:none}
.container{height:calc(100vh - 104px);display:flex;}
.sidebar{width:260px;background:#0b0b1b;border-right:1px solid #0ff4;padding:16px}
.main{flex:1;padding:20px;overflow:auto;background:#080810}
.tab{padding:10px 14px;margin:4px 0;cursor:pointer;border-radius:6px;color:#bcf;border:1px solid transparent}
.tab.active{background:#004477;color:#0ff;border-color:#0ff}
.tab:hover{background:#112244}
.panel{display:none}
.panel.active{display:block}
button{padding:8px 12px;border:none;border-radius:6px;background:#0055aa;color:#fff;cursor:pointer;margin:4px;border:1px solid #0ff6}
button.danger{background:#990022;border-color:#f446}
input,select{padding:8px;width:100%;margin:6px 0;border:1px solid #0ff4;border-radius:6px;background:#0a0a18;color:#eef}
.zone-card{border:1px solid #0ff4;padding:12px;border-radius:8px;margin:8px;background:#0b0b1b}
.media-item{cursor:pointer;}
#uploadBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;font-size:16px;background:#0077bb;border:1px solid #0ff8;color:#0ff;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:99}
.modal.show{display:flex}
.modal-content{background:#0b0b1b;border:1px solid #0ff6;padding:20px;border-radius:10px;width:90%;max-width:550px;color:#eef;max-height:85vh;overflow:auto}
#debugLog{margin-top:10px;color:#88a;font-size:12px;white-space:pre-wrap;max-height:120px;overflow:auto}
/* 登录弹窗 */
#loginWrap{position:fixed;inset:0;background:#080810;display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{border:1px solid #0ff6;padding:24px;border-radius:12px;width:90%;max-width:420px;background:#0b0b1b}
/* 图片预览弹窗 */
#previewModal{z-index:120}
#previewImg{max-width:100%;max-height:70vh;border-radius:6px}
</style>
</head>
<body>
<div id="banner"><span id="banner-text">欢迎来到CYBER AI素材同步平台</span></div>
<header>
  <h2 id="pageTitle">CYBER AI 素材同步平台</h2>
  <div id="headerRight">
    <div id="userInfo">未登录</div>
    <button id="adminBtn" onclick="openAdminModal()">后台管理</button>
    <button id="logoutBtn" onclick="logout()">退出登录</button>
  </div>
</header>
<!-- 登录界面，未登录才显示 -->
<div id="loginWrap">
  <div class="login-box">
    <h3>登录 / 注册</h3>
    <input id="user" placeholder="用户名">
    <input id="pwd" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <button onclick="register()">注册</button>
    <div id="debugLog"></div>
  </div>
</div>
<div class="container" style="display:none;">
  <aside class="sidebar">
    <div class="tab active" data-tab="zones">自定义分区</div>
    <div class="tab" data-tab="layout">布局管理</div>
    <div class="tab" data-tab="media">素材列表</div>
    <div class="tab" data-tab="banner">横幅跑马灯</div>
    <div class="tab" data-tab="setting">系统设置</div>
  </aside>
  <main class="main">
    <!-- 分区面板 -->
    <div class="panel active" id="panel-zones">
      <h3>自定义分区</h3>
      <input id="zoneName" placeholder="分区名称">
      <input id="zoneW" placeholder="宽度" type="number">
      <input id="zoneH" placeholder="高度" type="number">
      <label style="color:#bcf"><input type="checkbox" id="zoneUpload">允许用户上传</label>
      <button onclick="addZone()">新增分区</button>
      <div id="zoneList"></div>
    </div>
    <!-- 布局 -->
    <div class="panel" id="panel-layout">
      <h3>布局拖拽管理</h3>
      <div id="layoutList"></div>
    </div>
    <!-- 素材 -->
    <div class="panel" id="panel-media">
      <h3>素材播放列表</h3>
      <input id="mediaUrl" placeholder="媒体链接">
      <select id="mediaType">
        <option value="image">图片</option>
        <option value="video">视频</option>
        <option value="text">文字</option>
      </select>
      <button onclick="addMedia()">添加素材</button>
      <div id="mediaList"></div>
    </div>
    <!-- 横幅 -->
    <div class="panel" id="panel-banner">
      <h3>顶部跑马灯横幅</h3>
      <input id="bannerContent" placeholder="跑马灯文字">
      <button onclick="saveBanner()">保存横幅</button>
    </div>
    <!-- 系统设置 -->
    <div class="panel" id="panel-setting">
      <h3>系统设置</h3>
      <input id="sysTitle" placeholder="网页标题">
      <button onclick="saveSysSetting()">保存设置</button>
    </div>
  </main>
</div>
<button id="uploadBtn" onclick="openUploadModal()" style="display:none;">底部上传素材</button>
<!-- 素材上传弹窗 -->
<div class="modal" id="uploadModal">
  <div class="modal-content">
    <h3>上传素材</h3>
    <input id="uploadMediaUrl" placeholder="粘贴媒体地址">
    <button onclick="submitUpload()">确认上传</button>
    <button onclick="closeUploadModal()">关闭</button>
  </div>
</div>
<!-- 后台管理弹窗（右上角按钮弹出） -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3>管理员后台</h3>
    <button class="danger" onclick="clearAllData()">清空全部业务数据</button>
    <h4>用户管理</h4>
    <div id="userList"></div>
    <button onclick="closeAdminModal()">关闭</button>
  </div>
</div>
<!-- 图片预览弹窗 -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <img id="previewImg" alt="预览图">
    <button onclick="closePreviewModal()">关闭预览</button>
  </div>
</div>
<script>
// ====================【修改这里为你自己项目参数】====================
const SUPABASE_URL = "https://mqvxghfcglyrfnqmjtwd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YnQaAZSQZ3qhWwIovqaqWQ_uJNRwUrb";
// ====================================================================
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
const debugLog = document.getElementById("debugLog");
function log(msg){
  debugLog.innerText += msg + "\n";
  console.log(msg);
  debugLog.scrollTop = debugLog.scrollHeight;
}
function switchTab(tabId){
  tabs.forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(`panel-${tabId}`).classList.add('active');
}
// ==========登录函数 会话恢复==========
async function login(){
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pwd').value.trim();
  log(`尝试登录 user:${username}`);
  const {data,error}=await supabase
    .from('app_users')
    .select('*')
    .eq('username',username)
    .eq('password',password)
    .maybeSingle();
  if(error){
    log("查询错误:"+error.message);
    return alert('查询失败：'+error.message);
  }
  if(!data){
    log("无匹配用户");
    return alert('账号密码错误');
  }
  currentUser = data;
  localStorage.setItem("sessionUser",JSON.stringify(data));
  document.getElementById('userInfo').innerText=`${currentUser.username} (${currentUser.role})`;
  // 登录成功：隐藏登录框，显示主页面、上传按钮、退出登录
  document.getElementById('loginWrap').style.display = 'none';
  document.querySelector('.container').style.display = 'flex';
  document.getElementById('uploadBtn').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'block';
  // 只有管理员/超级管理员才显示后台按钮
  if(currentUser.role === "admin" || currentUser.role === "super_admin"){
    document.getElementById('adminBtn').style.display = 'block';
  }
  log("✅登录成功");
  alert('登录成功');
  loadAll();
}
// 退出登录
function logout(){
  localStorage.removeItem("sessionUser");
  currentUser = null;
  document.getElementById('loginWrap').style.display='flex';
  document.querySelector('.container').style.display='none';
  document.getElementById('uploadBtn').style.display='none';
  document.getElementById('adminBtn').style.display='none';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('userInfo').innerText="未登录";
  alert("已退出登录");
}
// 页面加载自动恢复会话
(async function restoreSession(){
  const saved = localStorage.getItem("sessionUser");
  if(saved){
    currentUser = JSON.parse(saved);
    document.getElementById('userInfo').innerText=`${currentUser.username} (${currentUser.role})`;
    document.getElementById('loginWrap').style.display = 'none';
    document.querySelector('.container').style.display = 'flex';
    document.getElementById('uploadBtn').style.display = 'block';
    document.getElementById('logoutBtn').style.display='block';
    if(currentUser.role === "admin" || currentUser.role === "super_admin"){
      document.getElementById('adminBtn').style.display = 'block';
    }
    log("已恢复上次登录会话");
    loadAll();
  }
})();
async function register(){
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pwd').value.trim();
  const {error}=await supabase.from('app_users').insert({username,password,role:'user'});
  if(error) {
    log("注册失败:"+error.message);
    return alert('注册失败，用户名重复');
  }
  log("✅注册成功");
  alert('注册成功');
}
// 后台弹窗
function openAdminModal(){
  document.getElementById('adminModal').classList.add('show');
  loadUserList();
}
function closeAdminModal(){document.getElementById('adminModal').classList.remove('show')}
// 图片预览
function openPreviewModal(url){
  document.getElementById('previewImg').src = url;
  document.getElementById('previewModal').classList.add('show');
}
function closePreviewModal(){document.getElementById('previewModal').classList.remove('show')}
// 用户列表加载（后台）
async function loadUserList(){
  const {data} = await supabase.from('app_users').select('*');
  const wrap = document.getElementById('userList');
  wrap.innerHTML="";
  data.forEach(u=>{
    let html = `<div class="zone-card">
      账号：${u.username}｜角色：${u.role}
      <select onchange="changeUserRole('${u.id}',this.value)">
        <option value="user" ${u.role==='user'?'selected':''}>普通用户</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
      </select>
    `;
    // 禁止删除超级管理员账号
    if(u.username !== '306680070'){
      html += `<button class="danger" onclick="deleteUser('${u.id}')">删除用户</button>`;
    }
    html += `</div>`;
    wrap.innerHTML += html;
  })
}
async function changeUserRole(userId, newRole){
  await supabase.from('app_users').update({role:newRole}).eq('id',userId);
  loadUserList();
}
async function deleteUser(userId){
  if(!confirm("确认删除该用户？")) return;
  await supabase.from('app_users').delete().eq('id',userId);
  loadUserList();
}
// 分区
async function addZone(){
  const zone_name = document.getElementById('zoneName').value;
  const width = Number(document.getElementById('zoneW').value);
  const height = Number(document.getElementById('zoneH').value);
  const allow_upload = document.getElementById('zoneUpload').checked;
  await supabase.from('custom_zones').insert({zone_name,width,height,allow_upload});
  loadZones();
}
async function loadZones(){
  const {data}=await supabase.from('custom_zones').select('*');
  const wrap = document.getElementById('zoneList');
  wrap.innerHTML="";
  data.forEach(z=>{
    wrap.innerHTML += `<div class="zone-card">${z.zone_name} ${z.width}×${z.height} <button onclick="delZone('${z.id}')">删除</button></div>`
  })
}
async function delZone(id){
  await supabase.from('custom_zones').delete().eq('id',id);
  loadZones();
}
// 布局
async function loadLayouts(){
  const {data}=await supabase.from('custom_layouts').select('*');
  const wrap=document.getElementById('layoutList');
  wrap.innerHTML="";
  if(!data || data.length===0){
    wrap.innerHTML="<div class='zone-card'>暂无布局数据</div>";
  }else{
    data.forEach(l=>{
      wrap.innerHTML += `<div class="zone-card">布局:${l.layout_name}</div>`
    })
  }
}
// 素材
async function addMedia(){
  const media_url = document.getElementById('mediaUrl').value;
  const media_type = document.getElementById('mediaType').value;
  await supabase.from('media_playlist').insert({media_url,media_type});
  loadMedia();
}
async function loadMedia(){
  const {data}=await supabase.from('media_playlist').select('*');
  const wrap=document.getElementById('mediaList');wrap.innerHTML="";
  data.forEach(m=>{
    let itemHtml = `<div class="zone-card media-item">`;
    if(m.media_type === 'image'){
      itemHtml += `<span onclick="openPreviewModal('${m.media_url}')">【点击预览图片】</span> `;
    }
    itemHtml += `${m.media_type}: ${m.media_url} <button onclick="delMedia('${m.id}')">删除</button></div>`;
    wrap.innerHTML += itemHtml;
  })
}
async function delMedia(id){
  await supabase.from('media_playlist').delete().eq('id',id);
  loadMedia();
}
// 横幅
async function saveBanner(){
  const content = document.getElementById('bannerContent').value;
  await supabase.from('banner_messages').upsert({content,enabled:true},{onConflict:'id'});
  loadBanner();
}
async function loadBanner(){
  const {data}=await supabase.from('banner_messages').select('*').limit(1).maybeSingle();
  if(data){
    document.getElementById('banner-text').innerText=data.content;
    document.getElementById('bannerContent').value=data.content;
  }
}
// 系统设置
async function saveSysSetting(){
  const title = document.getElementById('sysTitle').value.trim();
  document.getElementById('pageTitle').innerText = title;
  await supabase.from('account_store').upsert({store_key:'sys_title',store_value:title},{onConflict:'store_key'});
  alert("设置已保存");
  loadSysSetting();
}
async function loadSysSetting(){
  const {data}=await supabase.from('account_store').select('*').eq('store_key','sys_title').maybeSingle();
  if(data){
    document.getElementById('pageTitle').innerText = data.store_value;
    document.getElementById('sysTitle').value = data.store_value;
  }
}
// 清空全部业务数据
async function clearAllData(){
  if(!confirm("确定清空全部业务数据？（不会删除用户账号）")) return;
  await supabase.from('custom_zones').delete().neq('id','00000000-0000-0000-0000000000000');
  await supabase.from('custom_layouts').delete().neq('id','00000000-0000-0000-0000000000000');
  await supabase.from('media_playlist').delete().neq('id','00000000-0000-0000-0000000000000');
  await supabase.from('banner_messages').delete().neq('id','00000000-0000-0000-0000000000000');
  loadAll();
}
// 上传弹窗
function openUploadModal(){document.getElementById('uploadModal').classList.add('show')}
function closeUploadModal(){document.getElementById('uploadModal').classList.remove('show')}
async function submitUpload(){
  const url = document.getElementById('uploadMediaUrl').value;
  await supabase.from('media_playlist').insert({media_url:url,media_type:'image'});
  closeUploadModal();
  loadMedia();
}
// Realtime 实时监听
const channel = supabase.channel('global-sync')
.on('postgres_changes',{event:'*',schema:'public',table:'custom_zones'},()=>loadAll())
.on('postgres_changes',{event:'*',schema:'public',table:'custom_layouts'},()=>loadAll())
.on('postgres_changes',{event:'*',schema:'public',table:'media_playlist'},()=>loadAll())
.on('postgres_changes',{event:'*',schema:'public',table:'banner_messages'},()=>loadAll())
.on('postgres_changes',{event:'*',schema:'public',table:'app_users'},()=>loadUserList())
.on('postgres_changes',{event:'*',schema:'public',table:'account_store'},()=>loadSysSetting())
.subscribe();

async function loadAll(){
  await loadZones();
  await loadLayouts();
  await loadMedia();
  await loadBanner();
  await loadSysSetting();
}
loadAll();
</script>
</body>
</html>
